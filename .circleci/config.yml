version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.15
    resource_class: small
    steps:
      - checkout
      - run: pip install jsonschema
      - run: check-jsonschema --schemafile nests.schema.json nests.json
      - run: check-jsonschema --schemafile meta.schema.json meta.json
